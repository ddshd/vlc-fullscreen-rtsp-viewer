# Hardware-button refresh for the Surface 3.
# Format:  <KEY_NAME>  <value>  <command>      (value 1 = press)
#
# Confirm the exact key name your buttons emit with:  sudo evtest
# (pick the "gpio-keys" / "Surface 3 Buttons" device and press each button)
#
# The Windows/Home button usually reports as KEY_LEFTMETA.
# Volume buttons report as KEY_VOLUMEUP / KEY_VOLUMEDOWN.
# Do NOT bind KEY_POWER - logind treats it as shutdown/suspend.

KEY_LEFTMETA    1    systemctl restart camera-stream.service

# Prefer a volume button instead? Comment the line above and use one of:
# KEY_VOLUMEUP    1    systemctl restart camera-stream.service
# KEY_VOLUMEDOWN  1    systemctl restart camera-stream.service

name: Build release zip
# Builds surface3-camera-kiosk.zip. On every push to main it refreshes a public
# "latest" prerelease; on a version tag it publishes a versioned Release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Build the zip
        # git archive only includes committed, non-export-ignored files, so a
        # local /etc/camera-stream.env (git-ignored) can never leak into it.
        run: |
          git archive --format=zip \
            --prefix=surface3-camera-kiosk/ \
            -o surface3-camera-kiosk.zip HEAD
          unzip -l surface3-camera-kiosk.zip
      - name: Publish versioned Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: surface3-camera-kiosk.zip
      - name: Refresh rolling "latest" release (main pushes only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest surface3-camera-kiosk.zip \
            --title "Latest build" \
            --notes "Automatically built from ${{ github.sha }}" \
            --prerelease
